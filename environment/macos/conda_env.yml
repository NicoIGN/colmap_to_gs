name: gsplat

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.10
  - pip

  ########################################
  # PYTORCH (macOS, CPU / MPS)
  # Pas de pin : pytorch 2.3.1 exige llvm-openmp<16, incompatible avec pycolmap 4.2.1 (libfaiss -> llvm-openmp>=22.1.7)
  ########################################
  - pytorch
  - torchvision

  ########################################
  # SCIENTIFIC STACK
  ########################################
  - numpy=1.26.4
  - scipy=1.15.2
  - scikit-learn
  - plyfile=1.1
  - h5py=3.16.0

  ########################################
  # SFM
  ########################################
  - pycolmap=4.2.1
  # Une seule libomp partagée (pycolmap/torch conda) : évite « OMP: Error #15 » sur macOS.
  - llvm-openmp=22.1.7

  ########################################
  # PIP (hloc / SuperGlue : voir tools/colmap/install-hloc.sh)
  ########################################
  - pip:
      - gsplat
