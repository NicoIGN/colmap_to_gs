name: gsplat

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.10
  - pip

  ########################################
  # SCIENTIFIC STACK
  ########################################
  - numpy=1.26.4
  - scipy=1.15.2
  - scikit-learn
  - plyfile=1.1
  - h5py=3.16.0

  ########################################
  # SFM
  ########################################
  # Une seule libomp partagée (torch/pycolmap) : évite « OMP: Error #15 » sur macOS.
  - llvm-openmp=22.1.7

  ########################################
  # PIP (pycolmap, hloc / SuperGlue : voir tools/colmap/install-hloc.sh)
  ########################################
  - pip:
      - pycolmap==4.2.1
      - gsplat
