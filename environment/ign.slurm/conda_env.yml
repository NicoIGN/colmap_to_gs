name: gsplat

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - pip

  ########################################
  # BUILD TOOLS
  ########################################
  - cmake
  - ninja
  - gcc_linux-64=11
  - gxx_linux-64=11

  ########################################
  # PYTORCH CUDA 12.1
  ########################################
  - pytorch::pytorch=2.3.1
  - pytorch::torchvision=0.18.1
  - pytorch::torchaudio=2.3.1
  - pytorch::pytorch-cuda=12.1

  ########################################
  # CUDA BUILD COMPONENTS ONLY
  ########################################
  - nvidia::cuda-nvcc=12.1
  - nvidia::cuda-cudart-dev=12.1
  - nvidia::cuda-cccl=12.1

  ########################################
  # SCIENTIFIC STACK
  ########################################
  - numpy=1.26.4
  - scipy=1.15.2

  ########################################
  # UTILITIES
  ########################################
  - tqdm
  - matplotlib
  - ffmpeg
  - piexif
  - pyproj
  - fiona
  - imageio
  - imageio-ffmpeg
  - exiftool
  - rasterio
  - plyfile=1.1
  - openh264

  ########################################
  # GEOMETRY / SFM
  ########################################
  - colmap=3.8
  - faiss-cpu
  - pycolmap=4.2.1
  - h5py=3.16.0
  # Une seule libomp partagée (pycolmap/torch conda) : évite « OMP: Error #15 » sur macOS.
  - llvm-openmp=15.0.7

  ########################################
  # OPTIONAL UTILS
  ########################################
  - tree
  - rclone

  ########################################
  # PIP PACKAGES
  ########################################
  - pip:
      - nerfstudio==1.1.5
      - fpsample
      - gsplat
      - ultralytics
      - laspy[lazrs]
      - git+https://github.com/cvg/Hierarchical-Localization.git
      - git+https://github.com/facebookresearch/segment-anything.git
